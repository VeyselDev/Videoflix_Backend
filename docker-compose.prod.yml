services:
  static:
    image: nginx:alpine
    container_name: static
    restart: unless-stopped
    volumes:
      - static:/usr/share/nginx/html/static:ro
      - media:/usr/share/nginx/html/media:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static.rule=Host(`${BACKEND_HOST}`) && (PathPrefix(`/static`) || PathPrefix(`/media`))"
      - "traefik.http.routers.static.entrypoints=websecure"
      - "traefik.http.routers.static.tls=true"
      - "traefik.http.routers.static.tls.certresolver=myresolver"
      - "traefik.http.services.static.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik_proxy"

  backend:
    build:
      context: .
      target: prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_BACKEND_ROUTER}.rule=Host(`${BACKEND_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_BACKEND_ROUTER}.entrypoints=websecure"
      - "traefik.http.routers.${TRAEFIK_BACKEND_ROUTER}.tls=true"
      - "traefik.http.routers.${TRAEFIK_BACKEND_ROUTER}.tls.certresolver=myresolver"
      - "traefik.http.routers.${TRAEFIK_BACKEND_ROUTER}.middlewares=security-headers@docker"
      - "traefik.http.services.${TRAEFIK_BACKEND_ROUTER}.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.middlewares.security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.stsPreload=true"

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://backend:8000/health/ || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rq_worker:
    build:
      context: .
      target: prod

  rq_scheduler:
    build:
      context: .
      target: prod

networks:
  traefik_proxy:
    external: true