services:
  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://${BACKEND_HOST:-localhost}:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rq_worker:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - static:/app/static
      - ./media:/app/media

  rq_scheduler:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - static:/app/static
      - media:/app/media

networks:
  traefik_proxy: