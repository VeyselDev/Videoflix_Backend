services:
  traefik:
    command:
      - "--log.level=${TRAEFIK_LOG_LEVEL:-ERROR}"
      - "--log.format=json"
      - "--accesslog=true"
      - "--api.dashboard=${TRAEFIK_DASHBOARD:-true}"
      - "--api.insecure=${TRAEFIK_INSECURE:-true}"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./media:/app/media
      - static:/app/static
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.videoflix.rule=Host(`localhost`) && PathPrefix(`/`)"
      - "traefik.http.routers.videoflix.entrypoints=web"
      - "traefik.http.services.videoflix.loadbalancer.server.port=8000"

  rq_worker:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - ./media:/app/media
      - static:/app/static

  rq_scheduler:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
      - media:/app/media
      - static:/app/static