<html>
  <head>
    <meta charset="UTF-8">
    <style>
      .accent {
        color: #2E3EDF;
      }

      body {
        font-family: Arial, sans-serif;
        line-height: 1.5;
        color: #000000;
        margin: 0;
        padding: 0;
        background-color: #f9f9f9;
      }

      .email-container {
        width: 100%;
        padding: 20px 0;
        text-align: center;
      }

      .email-content {
        box-sizing: border-box;
        width: 600px;
        max-width: 100%;
        margin: 40px auto;
        background-color: #ffffff;
        border-radius: 8px;
        padding: 20px;
        text-align: left;
      }

      .logo {
        display: block;
        margin: 20px 0 0 0;
        width: 150px;
      }

      .button {
        display: inline-block;
        padding: 10px 16px;
        background-color: #2E3EDF;
        color: #ffffff;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        text-align: center;
      }

      p {
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="email-content">
        <p>Dear <span class="accent">{{ name }}</span>,</p>

        {% block email_body %}{% endblock %}

        {% if url %}
          <p>
            <a href="{{ url }}" class="button">{% block button_text %}{% endblock %}</a>
          </p>
          <p>Note that this link will expire in 24 hours.</p>
        {% endif %}

        {% block extra_info %}{% endblock %}

        <p>Best regards,</p>
        <p>Your Videoflix Team</p>

        <a href="{{ frontend_base_url }}" aria-label="Go to homepage">
          <img src="{{ frontend_base_url }}/{{ logo_file_name }}" alt="Logo" class="logo">
        </a>
      </div>
    </div>
  </body>
</html>
