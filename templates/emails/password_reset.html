{% load email_filters %}
<html>
  <body style="font-family: Arial, sans-serif; line-height: 1.5; color: #000;">
    <h2>Hello {{ user.email|before_at }},</h2>
    <p>You have requested a password reset. Click the link below to set a new password:</p>
    <a href="{{ reset_link }}"
       style="background-color:#000; color:white; padding:10px 20px; text-decoration:none; border-radius:5px; display:inline-block;">
       Reset Password
    </a>
    <p>If you did not request this, please ignore this email.</p>
    <hr>
    <p style="font-size:12px;">This is an automated email from Videoflix.</p>
  </body>
</html>
